{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Auth System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Welcome to Authentication System</h1>
    
    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {% if messages %}
  <div class="mb-4">
    {% for message in messages %}
      <div class="text-sm text-white px-4 py-2 rounded {{ message.tags }} {% if message.tags == 'error' %}bg-red-500{% else %}bg-green-500{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

      <div>
        <input
          type="text"
          name="username"
          placeholder="Enter your username"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
          required
        />
      </div>
      <div>
        <input
          type="password"
          name="password"
          placeholder="Enter your password"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
          required
        />
      </div>
      <div>
        <button
          type="submit"
          class="w-full bg-purple-600 text-white py-3 rounded-xl hover:bg-purple-700 transition duration-300"
        >
          Sign In
        </button>
      </div>
    </form>
  </div>

</body>
</html>
